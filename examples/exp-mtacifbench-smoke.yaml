name: "mtacif-smoke"
concurrency: 3
output_dir: "./output"

sandbox:
  host: "localhost:8080"
  request_timeout: 600
  api_key: "${SANDBOX_KEY}"

models:
  glm-5.2:
    base_url: "https://open.bigmodel.cn/api/anthropic/"
    api_key: "${ZHIPU_API_KEY}"
    model_name: "glm-5.2"
    timeout: 37160
    max_tokens: 32000

datasets:
  mtacifbench:
    name: "mtacifbench"
    adapter_type: "local_jsonl"
    data_dir: "benchmarks/mtacifbench/data_smoke"
    task_type: "benchmarks.mtacifbench.task.MTACIFBenchTask"
    judge_config_path:
      default: "benchmarks/mtacifbench/data_smoke/judge.yaml"
      instruction_following: "benchmarks/mtacifbench/data_smoke/judge.yaml"

agents:
  claude_code:
    type: "agent_probe.agents.claude_code.ClaudeCodeAgent"
    offline: true
    offline_package_dir: ${OFFLINE_PACKAGE_DIR}
