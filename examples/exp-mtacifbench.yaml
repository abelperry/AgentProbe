name: "agent-mtacifbench"
concurrency: 3
output_dir: "./output"

sandbox:
  host: "localhost:8080"
  request_timeout: 600

models:
  your-model:
    base_url: "${GATEWAY_BASE_URL}"
    api_key: "${GATEWAY_API_KEY}"
    model_name: "your-model"
    format: "anthropic"
    timeout: 37800
    max_tokens: 80000
    max_thinking_tokens: 16000
    thinking: "max"

datasets:
  mtacifbench:
    name: "mtacifbench"
    adapter_type: "local_jsonl"
    data_dir: "benchmarks/mtacifbench/data"
    task_type: "benchmarks.mtacifbench.task.MTACIFBenchTask"
    judge_config_path:
      default: "benchmarks/mtacifbench/data/judge.yaml"
      instruction_following: "benchmarks/mtacifbench/data/judge.yaml"

agents:
  claude_code:
    type: "agent_probe.agents.claude_code.ClaudeCodeAgent"
    version: "2.1.14"
    offline: true
    offline_package_dir: ${OFFLINE_PACKAGE_DIR}

  # Every agent listed runs against every model above.
