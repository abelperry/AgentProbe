# Instruction following only. See judge_if_function.yaml to also build the
# project and score its function checklist.

docker: "dayong657/playwright-mcp-base:0.1.0"

model:
  base_url: "${GATEWAY_BASE_URL}"
  api_key: "${GATEWAY_API_KEY}"
  model_name: "deepseek-v4-pro"
  format: "anthropic"
  timeout: 37260
  max_tokens: 64000

agent:
  type: "agent_probe.agents.claude_code.ClaudeCodeAgent"
  version: "2.1.14"
  offline: true
  offline_package_dir: ${OFFLINE_PACKAGE_DIR}
