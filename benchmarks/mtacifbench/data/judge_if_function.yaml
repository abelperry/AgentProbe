# Instruction following *and* functional evaluation.
#
# Point a dataset's judge_config_path here instead of judge.yaml to turn the
# functional pass on. It costs a build, an HTTP server and a browser-driving
# judge per task, which is why it is not the default -- see
# benchmarks/mtacifbench/function_eval.py.

model:
  base_url: "${GATEWAY_BASE_URL}/"
  api_key: "${GATEWAY_API_KEY}"
  model_name: "deepseek-v4-pro"
  format: "anthropic"
  timeout: 37260
  max_tokens: 64000

agent:
  type: "agent_probe.agents.claude_code.ClaudeCodeAgent"
  version: "2.1.199"
  # One judge container per round: an online `npm i -g` at that rate hits
  # ECONNRESET on this host, so install the native binary from the offline
  # package instead (the judge image has no npm to fall back on either).
  offline: true
  offline_package_dir: ${OFFLINE_PACKAGE_DIR}

function_checklist_eval_enabled: true

# Reading a rendered page is a different job from reading a transcript, so the
# functional pass gets its own model. Omit either block to fall back to the
# judge above.
function_model:
  base_url: "${GATEWAY_BASE_URL}/"
  api_key: "${GATEWAY_API_KEY}"
  model_name: "claude-sonnet-4-6-thinking"
  format: "anthropic"
  timeout: 3600
  max_tokens: 64000
  thinking: "high"
  max_thinking_tokens: 16000

function_agent:
  type: "agent_probe.agents.claude_code.ClaudeCodeAgent"
  version: "2.1.199"
  offline: true
  offline_package_dir: ${OFFLINE_PACKAGE_DIR}
  # The checks are things like "hovering a status light shows a tooltip", so
  # the judge needs a real browser. This is why judge_docker must be the
  # Playwright image (dayong657/playwright-mcp-base) rather than the plain one.
  mcp_host_path: "config/mcp/playwright.json"
