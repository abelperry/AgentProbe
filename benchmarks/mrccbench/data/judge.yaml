model:
  base_url: "https://open.bigmodel.cn/api/anthropic/"
  api_key: "${ZHIPU_API_KEY}"
  model_name: "glm-5.1"
  timeout: 7200
  max_tokens: 32000

agent:
  type: "agent_probe.agents.claude_code.ClaudeCodeAgent"
  mcp_host_path: "config/mcp/playwright.json"

extract_api:
  base_url: "${GATEWAY_BASE_URL}/v1"
  api_key: "${GATEWAY_API_KEY}"
  model_name: "deepseek-v4-pro"
  format: "openai"
  timeout: 120
  max_tokens: 1024
